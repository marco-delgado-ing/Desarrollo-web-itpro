<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de acceso</title>
    <link rel="stylesheet" href="../styles/evaluadorAlumno.css">
    <script src="../js/login.js" defer></script>
</head>

<body>
    <main class="contenedor" id="home">
        <h1>Sistema de acceso</h1>
        <p id="mensaje" aria-live="polite"></p>
        <section class="panel">
            <h2>Resultado</h2>
            <div id="sesion"></div>
            <button id="cerrarSesion" type="button" hidden>
                Cerrar sesión
            </button>
        </section>
        <section class="panel" id="panelAlumnos">
            <div class="encabezado-alumnos">
                <div>
                    <h2>Alumnos registrados</h2>
                    <p>Datos obtenidos por API-alumnos</p>
                </div>
                <button id="cargarDatos">Actualizar</button>
            </div>
            <p id="estadoDatos">
                Cargando datos...
            </p>

            <div id="contenedorDatos">
                
            </div>
        </section>
    </main>
</body>

</html>
