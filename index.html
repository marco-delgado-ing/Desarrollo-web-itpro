<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de acceso</title>
    <link rel="stylesheet" href="./styles/evaluadorAlumno.css">
    <script src="./js/login.js" defer></script>
</head>

<body>
    <main class="contenedor">
        <h1>Sistema de acceso</h1>
        <p id="mensaje" aria-live="polite"></p>
        <section class="panel">
            <h2>Iniciar sesión</h2>

            <form id="formLogin">
                <label for="correoLogin">Correo electrónico</label>
                <input id="correoLogin" type="email" required>

                <label for="passwordLogin">Contraseña</label>
                <input id="passwordLogin" type="password" required>
                <!-- CAMBIO 6 -->
                <a href="./pages/registro.html">Crear cuenta</a>
                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>
</body>

</html>
